name: Original Kane export runtime proof
on:
  push:
    branches: [qa/export-runtime-proof-20261015]
    paths:
      - 'tests/export-runtime/**'
      - '.github/workflows/export-runtime-proof.yml'
permissions:
  contents: read
jobs:
  exported-python:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect original export and check JavaScript syntax
        run: |
          python tests/export-runtime/audit.py
          node --check tests/export-runtime/javascript/test.js
      - name: Install exported Python dependencies
        run: python -m pip install -r tests/export-runtime/python/requirements.txt
      - name: Execute one original Python export with smart mode
        env:
          LT_USERNAME: ${{ secrets.LT_USERNAME }}
          LT_ACCESS_KEY: ${{ secrets.LT_ACCESS_KEY }}
          TESTMU_RUN_TARGET: cloud
          TESTMU_SMART: '1'
          TESTMU_HEADLESS: 'true'
          BUILD: export-runtime-${{ github.run_id }}
          IDLE_TIMEOUT: '120'
          VIDEO: 'true'
          CONSOLE: 'true'
          NETWORK: 'false'
          LT_PLATFORM: linux
          LT_BROWSER: Chrome
        run: python tests/export-runtime/run_once.py
      - name: Preserve sanitized runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-export-runtime-${{ github.run_id }}
          path: tests/export-runtime/artifacts/
          retention-days: 7
